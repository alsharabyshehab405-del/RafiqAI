<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rafiq AI Admin</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef;padding:24px}main{max-width:1100px;margin:auto}input,button{padding:10px;margin:4px;border-radius:8px;border:1px solid #334;background:#111a33;color:#eef}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#121a2d;padding:16px;border-radius:12px}.muted{color:#9aa8c0}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:8px;border-bottom:1px solid #26304a;text-align:left}</style></head><body><main><h1>Rafiq AI Admin</h1><p class="muted">Deploy this dashboard separately from the consumer app. Never embed service secrets here.</p><section><input id="api" placeholder="https://api.example.com"><input id="token" type="password" placeholder="Admin access token"><button onclick="load()">Load</button></section><div id="cards" class="grid"></div><table><thead><tr><th>ID</th><th>Email</th><th>Plan</th><th>Status</th><th>Created</th></tr></thead><tbody id="users"></tbody></table></main><script>async function get(path){let r=await fetch(document.getElementById('api').value.replace(/\/$/,'')+path,{headers:{Authorization:'Bearer '+document.getElementById('token').value}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}async function load(){try{let s=await get('/admin/stats');document.getElementById('cards').innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><strong>${v}</strong></div>`).join('');let u=await get('/admin/users');document.getElementById('users').innerHTML=u.map(x=>`<tr><td>${x.id}</td><td>${x.email}</td><td>${x.plan}</td><td>${x.disabled?'disabled':'active'}</td><td>${x.created_at}</td></tr>`).join('')}catch(e){alert(e.message)}}</script></body></html>
