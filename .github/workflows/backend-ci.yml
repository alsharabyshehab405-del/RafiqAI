name: Backend CI + PostgreSQL Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rafiq_test
          POSTGRES_USER: rafiq
          POSTGRES_PASSWORD: test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rafiq -d rafiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: {run: {working-directory: backend}}
    env:
      DATABASE_URL: postgresql+psycopg://rafiq:test-password@localhost:5432/rafiq_test
      JWT_SECRET: test-secret-test-secret-test-secret-123456
      AI_BASE_URL: https://example.invalid/v1
      AI_API_KEY: test-key
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app migrations
      - run: alembic upgrade head
      - run: PYTHONPATH=.:.. pytest -q
      - name: Eval regression gate
        run: PYTHONPATH=.:.. python -m pytest -q tests/test_eval_safety.py
      - run: python -c "import redis; r=redis.Redis(host='localhost',port=6379); assert r.ping()"
