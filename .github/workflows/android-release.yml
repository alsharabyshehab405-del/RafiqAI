name: Android Release APK + AAB
on: workflow_dispatch
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RAFIQ_BASE_URL: ${{ vars.RAFIQ_BASE_URL }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.1.0'}
      - name: Validate production configuration
        run: test -n "$RAFIQ_BASE_URL"
      - name: Decode Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rafiq-release.jks"
            echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING_BLOCKED — release will be compiled unsigned; no signing secret is written to the repository."
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Build, unit test and lint (signed when configured)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(lintRelease test assembleRelease bundleRelease -PrafiqBaseUrl="$RAFIQ_BASE_URL" -PsentryDsn="$SENTRY_DSN" --no-daemon)
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            args+=(
              -PrafiqStoreFile="$RUNNER_TEMP/rafiq-release.jks"
              -PrafiqStorePassword="$KEYSTORE_PASSWORD"
              -PrafiqKeyAlias="$KEY_ALIAS"
              -PrafiqKeyPassword="$KEY_PASSWORD"
            )
          fi
          gradle "${args[@]}"
      - name: Verify artifacts
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
